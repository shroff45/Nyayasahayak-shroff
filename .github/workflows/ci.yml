name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # node_modules is tracked in this repository. `npm ci` throws it away and installs
      # exactly what package-lock.json names, so a build never depends on whichever platform
      # binary happened to be committed (that is what breaks `tsc`/`vite` on a fresh clone).
      - name: Install from lockfile
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Behavioural tests
        run: npm test

      # The ledger's own claims, tested against the shipped module: tampering by a writer,
      # persistence across a reload, offline certificate verification, and the absence of
      # post-quantum / zero-knowledge labels in the code. It exits non-zero when a claim fails,
      # which is why it is allowed in this file at all - an earlier draft of this step pointed at
      # a harness that printed FAIL and still returned 0.
      - name: Ledger claims must hold
        run: node tools/ledger_repro.cjs

      - name: Production build
        run: set -o pipefail && npm run build | tee /tmp/build.log

      # A 624 kB entry chunk is already tight for the 2G/low-bandwidth courts this app claims to
      # serve. The budget is on the file that ships (BUNDLE_BUDGET_BYTES, 660,000 B today, a ratchet
      # set at the first byte-level measurement - see D35) and, for continuity with the figures this
      # repository published before D35, on vite's printed kB too (BUNDLE_BUDGET_KB, 600). The two are
      # not the same number: vite counts a chunk's UTF-16 length and this app's Hindi UI strings are
      # ~80,000 multibyte characters inside the entry chunk, so the same file reads 472.76 kB there and
      # 624.41 kB here. --dir dist is passed explicitly so the step does not depend on a default.
      - name: Enforce bundle-size budget
        run: node tools/check_bundle_size.mjs /tmp/build.log --dir dist

      # The chained journey (citizen intake -> officer's locker -> judge's re-verification). It drives
      # `vite preview` on the build the two steps above just produced and passed, so what CI clicks is
      # what a courthouse browser would load. Only chromium is installed: one engine, because a
      # cross-browser matrix would be a support promise this app has not made.
      - name: Install the Chromium build Playwright expects
        run: npx playwright install --with-deps chromium

      - name: End-to-end journey must pass
        run: npx playwright test
