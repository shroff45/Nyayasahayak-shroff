name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # node_modules is tracked in this repository. `npm ci` throws it away and installs
      # exactly what package-lock.json names, so a build never depends on whichever platform
      # binary happened to be committed (that is what breaks `tsc`/`vite` on a fresh clone).
      - name: Install from lockfile
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Behavioural tests
        run: npm test

      - name: Production build
        run: set -o pipefail && npm run build | tee /tmp/build.log

      # A 575 kB entry chunk is already tight for the 2G/low-bandwidth courts this app
      # claims to serve; failing on >600 kB keeps that from drifting unnoticed.
      - name: Enforce bundle-size budget
        run: node tools/check_bundle_size.mjs /tmp/build.log
